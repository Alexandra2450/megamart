<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Megamart</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,541;1,541&family=Zen+Maru+Gothic&display=swap" rel="stylesheet">
    <script
        src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
        crossorigin="anonymous">
    </script>
</head>
<body>
    <div class="head__background">
        <div class="container">
            <div class="head__maininfo">
                <div class="head__maininfo-text">
                    Welcome to worldwide Megamart!
                </div>
                <div class="head__maininfo-offers">
                    <div class="head__maininfo-deliver">
                        <div class="head__maininfo-deliver-img">
                            <img src="img/location.png" class="head__maininfo-deliver-imgFile">
                        </div>
                        <div class="head__maininfo-deliver-text">
                            Deliver to <b>423651</b>
                        </div>
                    </div>
                    <div class="head__maininfo-deliver">
                        <div class="head__maininfo-track-img">
                            <img src="img/delivery-truck.png" class="head__maininfo-track-imgFile">
                        </div>
                        <div class="head__maininfo-track-text">
                            Track your order
                        </div>
                    </div>
                    <div class="head__maininfo-deliver">
                        <div class="head__maininfo-alloffers-img">
                            <img src="img/delivery-truck.png" class="head__maininfo-alloffers-imgFile">
                        </div>
                        <div class="head__maininfo-alloffers-text">
                            All Offers
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <section>
        <div class="head__menu">
            <div class="container">
                <div class="head__menu-flex">
                    <div class="head__menu-flex-left">
                        <div class="head__menu-flex-left-icon">
                            <img src="img/menuInHead.png" class="head__menu-flex-left-icon-file">
                        </div>
                        <div class="head__menu-flex-left-logo">
                            <img src="img/logo.png" class="head__menu-flex-left-logo-file">
                        </div>
                    </div>

                    <div class="head__menu-flex-right">
                        <div class="head__menu-flex-right-input">
                            <img src="img/search.png" class="head__menu-flex-right-input-icon">
                            <input class="head__menu-flex-right-input-search" type="text" name="search" placeholder="Search essentials, groceries and more...">
                            <img src="img/list.png" class="head__menu-flex-right-input-strings">
                        </div>

                        <div class="head__menu-flex-kabinet">
                            <div class="head__menu-login">
                                <div class="head__menu-login-logo">
                                    <img src="img/user.png" class="head__menu-login-logo-img">
                                </div>
                                <div class="head__menu-login-text">
                                    <b>Sign Up/Sign In</b>
                                </div>
                            </div>
                            <div class="head__menu-korzina">
                                <div class="head__menu-korzina-logo">
                                    <img src="img/buy.png" class="head__menu-korzina-logo-img">
                                </div>
                                <div class="head__menu-korzina-text">
                                    <b>Cart</b>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <section>
        <div class="menu__slider-shell">
            <div class="container">
                <div class="menu__slider">
                    <div class="menu__slider-list">
                        
                    </div>
                </div> 
            </div>
        </div>
    </section>

    <section>
        <div class="promo__slider-shell">
            <div class="promo-slider__btn promo__slider-prev-button">
                <img src="img/prev-button.png" class="promo__slider-prev-button-img">
            </div>
            <div class="container">
                <div class="promo__slider">
                    <div class="promo__slider-window">
                        <div class="promo__slider-track">
                            <div class="promo__slider-slide">
                                <div class="promo__slider-slide-content">
                                    <div class="promo__slider-slide-content-text">
                                        Best Deal Online on smart watches
                                    </div>
                                    <div class="promo__slider-slide-content-big-text">
                                        SMART WEARABLE.
                                    </div>
                                    <div class="promo__slider-slide-content-text">
                                        UP to 80% OFF
                                    </div>
                                </div>
                                <div class="promo-slider__img">
                                    <img src="img/watches.png">
                                </div>
                            </div>
                            <div class="promo__slider-slide">
                                <div class="promo__slider-slide-content">
                                    <div class="promo__slider-slide-content-text">
                                        Best Deal Online on smart watches
                                    </div>
                                    <div class="promo__slider-slide-content-big-text">
                                        SMART WEARABLE.
                                    </div>
                                    <div class="promo__slider-slide-content-text">
                                        UP to 80% OFF
                                    </div>
                                </div>
                                <div class="promo-slider__img">
                                    <img src="img/watches.png">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="promo__slider-dots">
                        <div class="promo__slider-dot active"></div>
                        <div class="promo__slider-dot"></div>
                    </div>
                </div>
            </div>
            <div class="promo-slider__btn promo__slider-next-button">
                <img src="img/next-button.png" class="promo__slider-next-button-img">
            </div>
        </div>
    </section>

    <section>
        <div class="container">
            <div class="main__view">
                <div class="main__view-head">
                    <div class="main__view-head-title">
                        Grab the best deal on <span class="hilight-text">Smartphones</span>
                    </div>
                    <div class="main__view-head-view-all">
                        <div class="main__view-head-view-all-text">
                            View All
                        </div>
                        <img src="img/arrowLeft.png" class="main__view-head-view-all-img">
                    </div>
                </div>

                <div class="main__view-products-list">
                    <div class="main__view-product">
                        
                    </div>
                </div>

            </div>
        </div>

    </section>

<script>
    let actualCategory = "Groceries";

    const categories = [
        { id: "groceries", name: "Groceries" },
        { id: "premium", name: "Premium Fruits" },
        { id: "home", name: "Home & Kitchen" },
        { id: "fashion", name: "Fashion" },
        { id: "electronics", name: "Electronics" },
        { id: "beauty", name: "Beauty" },
        { id: "home-improvement", name: "Home Improvement" },
        { id: "sports", name: "Sports, Toys & Luggage" }
    ];

    var products = [
        {
            name: "Galaxy S22 Ultra",
            newPrice: "32999",
            oldPrice: "74999",
            img: "img/phone1.png"
        },
        {
            name: "Galaxy M13 (4GB | 64 GB )",
            newPrice: "10499",
            oldPrice: "14999",
            img: "img/phone2.png"
        },
        {
            name: "Galaxy M33 (4GB | 64 GB )",
            newPrice: "16999",
            oldPrice: "24999",
            img: "img/phone3.png"
        },
        {
            name: "Galaxy M53 (4GB | 64 GB )",
            newPrice: "31999",
            oldPrice: "40999",
            img: "img/phone4.png"
        },
        {
            name: "Galaxy S22 Ultra",
            newPrice: "67999",
            oldPrice: "85999",
            img: "img/phone5.png"
        }

    ];

    function menuRender(actualCategory){
        $(".menu__slider-list").html("");
        $(".main__view-products-list").html("");
        categories.forEach( (el) => {
            let actualClass = (el.name == actualCategory) ? " navigation-button-active" : "";
            let arrowImg = (el.name == actualCategory) ? "img/arrowDownActive.png" : "img/arrowDown.png" ;
            $(".menu__slider-list").append(`
                <div class="navigation-button${actualClass}" data-name="${el.name}">
                    ${el.name}
                    <img src="${arrowImg}" class="navigation-icon">
                </div>
            `);
        });
        products.forEach((el) => {
            let saveMoneyProcents = parseInt(el.newPrice) * 100 / parseInt(el.oldPrice);
            let saveMoney = parseInt(el.oldPrice) - parseInt(el.newPrice);
            $(".main__view-products-list").append(`
                <div class="main__view-product">
                    <div class="main__view-product-img">
                        <img src="${el.img}" class="main__view-product-img-file">
                    </div>
                    <div class="main__view-product-context">
                        <div class="main__view-product-name">
                            ${el.name}
                        </div>
                        <div class="main__view-product-prices">
                            <div class="main__view-product-prices-new">
                                <b>₹${el.newPrice}</b>
                            </div>
                            <div class="main__view-product-prices-old">
                                ₹${el.oldPrice}
                            </div>
                        </div>
                        <div class="main__view-product-prices-save">
                            Save - ₹${saveMoney}
                        </div>
                    </div>
     
                </div>
            `);
        });

    }

    menuRender(actualCategory);

    $(".menu__slider-list").on( "click", ".navigation-button", function() {
        $(".navigation-button").removeClass("navigation-button-active");
        $(this).addClass("navigation-button-active");
        actualCategory = $(this).data("name");
        menuRender(actualCategory);
    } );


    let currentIndex = 0;                  
    const slides = $(".promo__slider-slide");
    const totalSlides = slides.length;
    const track = $(".promo__slider-track");

    function updateSlider() {
        const offset = -currentIndex * 100;
        track.css("transform", `translateX(${offset}%)`);

        $(".promo__slider-dot").removeClass("active");
        $(".promo__slider-dot").eq(currentIndex).addClass("active");
    }

    $(".promo__slider-next-button").on("click", function() {
        currentIndex++;
        if (currentIndex >= totalSlides) {
            currentIndex = 0; 
        }
        updateSlider();
    });

    $(".promo__slider-prev-button").on("click", function() {
        currentIndex--;
        if (currentIndex < 0) {
            currentIndex = totalSlides - 1; 
        }
        updateSlider();
    });

    $(".promo__slider-dot").on("click", function() {
        currentIndex = $(this).index();
        updateSlider();
    });

</script>

</body>
</html>
